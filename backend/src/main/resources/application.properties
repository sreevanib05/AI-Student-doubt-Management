spring.application.name=doubtflow-ai
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8081}
debug=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Keep secrets in application-local.properties.
# That file is ignored by Git and stays only on your computer.

app.jwt.expiration-ms=86400000
app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging.level.org.springframework.security=INFO
logging.level.org.springframework=INFO
logging.level.root=INFO
